spring:
    datasource:
        url: jdbc:mysql://${MYSQL_ADDRESS}/fan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        type: com.zaxxer.hikari.HikariDataSource

auth:
  jwt:
    secret: ${JWT_SECRET}
    expire-days: 90

qiniu:
  access-key: ${QINIU_ACCESS_KEY}
  secret-key: ${QINIU_SECRET_KEY}
  bucket: rallyo
  domain: https://static.fantasticmonkey.top

job:
  tour:
    enabled: true
    collect:
      live:
        cron: "0 */5 * * * ?"
      rank:
        cron: "0 0 4 * * ?"
  meetup:
    enabled: true
    status:
      cron: "0 0 2 * * ?"
    court-statistics:
      cron: "0 0 3 * * ?"
  # 支付超时单清理兜底；支付入口会自行判断并重建超时单，不依赖此任务
  payment_timeout:
    enabled: false
    cron: "0 */5 * * * ?"
  # 回调漏处理补偿：扫 payment_log 中 RECEIVED 超时未处理的重放
  # 本次新增，发布时先关闭，确认无误后再手动开启
  payment_callback_recover:
    enabled: false
    cron: "0 */10 * * * ?"
  # 赛事每日凌晨批量匹配（资格赛+正赛逐轮）
  # 本次新增，发布时先关闭，确认无误后再手动开启
  tournamentMatch:
    enabled: false
    cron: "0 0 2 * * ?"
  # 赛事比赛超时处理（每2小时扫描）
  tournamentMatchTimeout:
    enabled: true
    cron: "0 0 */2 * * ?"
