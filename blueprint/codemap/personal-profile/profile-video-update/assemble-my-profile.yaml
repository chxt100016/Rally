id: personal-profile.profile-video-update.activity.assemble-my-profile
files:
  - path: rally-app/src/main/java/com/rally/personal-profile/basic-profile-update/activity/AssembleMyProfileActivity.java
    role: 复用唯一的本人档案组装实现，重读标题更新后的档案并按状态组装基础或完整返回
    symbols: [AssembleMyProfileActivity]
    covers: [A1, A2, A3]
  - path: rally-app/src/main/java/com/rally/user/MyProfileAppService.java
    role: 保留原 getMyProfile 签名，从当前用户上下文委托共享组装活动
    symbols: [MyProfileAppService.getMyProfile]
    covers: [A1, A2, A3]
  - path: rally-app/src/main/java/com/rally/user/ProfileAppService.java
    role: 在视频标题更新事务内同步调用共享本人档案组装，组装异常继续传播并回滚标题保存
    symbols: [ProfileAppService.updateVideo]
    covers: [A1, A2, A3]
