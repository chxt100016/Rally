    symbols: [MyProfileAppService.getMyProfile]
    covers: [A1, A2, A3]
  - path: rally-app/src/main/java/com/rally/user/ProfileAppService.java
    role: 在视频列表更新和外部文件删除后于同一数据库事务内组装档案，异常回滚数据库但不恢复文件
    symbols: [ProfileAppService.deleteVideo]
    covers: [A1, A2, A3]
