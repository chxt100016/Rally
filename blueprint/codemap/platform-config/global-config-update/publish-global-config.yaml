id: platform-config.global-config-update.activity.publish-global-config
files:
  - path: rally-app/src/main/java/com/rally/platform-config/global-config-update/activity/PublishGlobalConfigActivity.java
    role: 校验规范化配置（含 POSTER 区块 cityId 与海报三端 URL 的 cityCode/cityName 占位符）、编排首次或 CAS 发布，并在事务内重建当前 JVM 缓存
    symbols: [PublishGlobalConfigActivity]
    covers: [A1, A2, A3]
  - path: rally-domain/src/main/java/com/rally/domain/system/enums/SystemConfigKey.java
    role: 登记唯一完整首页配置键及使用 cityCode/cityName 占位符的内置默认首页 JSON
    symbols: [SystemConfigKey.HOME_PAGE_CONFIG]
    covers: [A1]
  - path: rally-domain/src/main/java/com/rally/domain/platform-config/PlatformConfig.java
    role: 首次发布严格校验，已有记录覆盖发布时允许旧内容绕过当前名录校验，并以 CAS 写入已校验的新值
    symbols: [PlatformConfig.firstPublish, PlatformConfig.restoreForPublish, PlatformConfig.publish]
    covers: [A2]
  - path: rally-adapter/src/main/java/com/rally/web/system/SystemController.java
    role: 暴露通用配置发布入口，发布成功后查询并返回最新全量配置视图
    symbols: [SystemController.updateConfig]
    covers: [A1, A2, A3]
