project: Rally

# {capability} 与 {service} 由业务活动 id 的对应段替换,{name} 由领域能力 id 的第二段替换
layout:
  app: "rally-app/src/main/java/com/rally/{capability}/"
  domain: "rally-domain/src/main/java/com/rally/domain/{name}/"

# 全局可读路径,追加到每次 bp scope 的输出末尾。
# 填共享工具、类型定义这类跨活动都要看的目录,按本项目实际结构写;不确定就先留空。
always_readable: []

verify:
  app: "mvn -DskipTests compile"
